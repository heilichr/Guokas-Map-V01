<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>
  Waushara County Imagery with Trails, Stands, Contours, and Parcels
</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Prevent GitHub Pages caching -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
  html, body {
    height: 100%;
    margin: 0;
  }

  #map {
    height: 100%;
    width: 100%;
  }

  .stand-label {
    font-size: 12px;
    font-weight: bold;
    color: black;
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid #333;
    border-radius: 3px;
    padding: 1px 4px;
    white-space: nowrap;
  }

  .heading-arrow {
    width: 20px;
    height: 20px;
    background: lime;
    border-radius: 50%;
    border: 2px solid white;
    transform-origin: center;
  }
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.19/dist/esri-leaflet.js"></script>

<script>
  // ==========================================================
  // INITIALIZE MAP (Plainfield default)
  // ==========================================================
  const map = L.map('map').setView([44.18125, -89.48712], 16);

  // ==========================================================
  // BASEMAPS (NAIP REMOVED)
  // ==========================================================

  const waushara2025 = L.esri.imageMapLayer({
    url: 'https://gis.co.waushara.wi.us/arcgis/rest/services/Imagery/Waushara_Co_2025_sid/ImageServer',
    attribution: '2025 imagery © Waushara County / WROC / Ayres Associates'
  });

  const wisconsinLeafOff = L.esri.imageMapLayer({
    url: 'https://dnrmaps.wi.gov/arcgis_image/rest/services/DW_Imagery/EN_Image_Basemap_Latest_Leaf_Off/ImageServer',
    attribution: 'Imagery © Wisconsin DNR / WROC'
  });

  const wisconsinLeafOn = L.esri.imageMapLayer({
    url: 'https://dnrmaps.wi.gov/arcgis_image/rest/services/DW_Imagery/EN_Image_Basemap_Latest_Leaf_On/ImageServer',
    attribution: 'Imagery © Wisconsin DNR / USDA NAIP'
  });

  const esriImagery = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'Tiles © Esri', maxZoom: 19 }
  );

  // Default basemap
  waushara2025.addTo(map);

  // ==========================================================
  // STYLE DEFINITIONS
  // ==========================================================

  const trailStyle = { color: "#a3783e", weight: 3, opacity: 1 };
  const contoursWaterStyle = { color: "#5891a4", weight: 1, opacity: 1, fillColor: "#4e9be8", fillOpacity: 0.4 };
  const contours1100Style = { color: "#8f8f8f", weight: 1, opacity: 1 };
  const contours3Style = { color: "#8f8f8f", weight: 0.75, opacity: 0.9 };
  const standStyle = { radius: 5, fillColor: "yellow", color: "black", weight: 1, fillOpacity: 0.9 };
  const parcelsStyle = { color: "red", weight: 0.7, opacity: 0.8, fillOpacity: 0 };

  // ==========================================================
  // LOAD GEOJSON LAYERS
  // ==========================================================

  const trailsLayer = L.layerGroup().addTo(map);
  fetch('Trails.geojson').then(r => r.json()).then(d => L.geoJSON(d, { style: trailStyle }).addTo(trailsLayer));

  const contoursWaterLayer = L.layerGroup().addTo(map);
  fetch('contourswater.geojson').then(r => r.json()).then(d => L.geoJSON(d, { style: contoursWaterStyle }).addTo(contoursWaterLayer));

  const contours1100Layer = L.layerGroup().addTo(map);
  fetch('contours1100.geojson').then(r => r.json()).then(d => L.geoJSON(d, { style: contours1100Style }).addTo(contours1100Layer));

  const contours3Layer = L.layerGroup().addTo(map);
  fetch('contours3.geojson').then(r => r.json()).then(d => L.geoJSON(d, { style: contours3Style }).addTo(contours3Layer));

  const standsLayer = L.layerGroup().addTo(map);
  fetch('Stands.geojson').then(r => r.json()).then(data => {
    L.geoJSON(data, {
      pointToLayer: (feature, latlng) => {
        const marker = L.circleMarker(latlng, standStyle);
        const label = feature.properties.Name;
        if (label) {
          marker.bindTooltip(label, {
            permanent: true,
            direction: "top",
            offset: [0, -8],
            className: "stand-label"
          });
        }
        return marker;
      }
    }).addTo(standsLayer);
  });

  const parcelsLayer = L.layerGroup().addTo(map);
  fetch('Parcels.geojson').then(r => r.json()).then(d => L.geoJSON(d, { style: parcelsStyle }).addTo(parcelsLayer));

  // ==========================================================
  // GPS OVERLAY + BREADCRUMB TRAIL
  // ==========================================================

  const gpsLayer = L.layerGroup();
  const breadcrumbLayer = L.polyline([], { color: "orange", weight: 3 });

  let userMarker = null;
  let headingMarker = null;
  let initialGPSCentered = false;
  let breadcrumbEnabled = false;

  function startGPS() {
    map.locate({
      watch: true,
      enableHighAccuracy: true
    });

    map.on("locationfound", onLocationFound);
    map.on("locationerror", onLocationError);
  }

  function stopGPS() {
    map.stopLocate();
    map.off("locationfound", onLocationFound);
    map.off("locationerror", onLocationError);

    initialGPSCentered = false;

    if (userMarker) {
      map.removeLayer(userMarker);
      userMarker = null;
    }
    if (headingMarker) {
      map.removeLayer(headingMarker);
      headingMarker = null;
    }
  }

  function onLocationFound(e) {
    const latlng = e.latlng;

    // Center map only once
    if (!initialGPSCentered) {
      map.setView(latlng, 17);
      initialGPSCentered = true;
    }

    // Location dot (true blue, smaller)
    if (!userMarker) {
      userMarker = L.circleMarker(latlng, {
        radius: 10,
        fillColor: "#007bff",
        color: "#ffffff",
        weight: 2,
        fillOpacity: 0.9
      }).addTo(gpsLayer);
    } else {
      userMarker.setLatLng(latlng);
    }

    // Heading arrow
    if (!headingMarker) {
      headingMarker = L.marker(latlng, {
        icon: L.divIcon({
          className: "",
          html: '<div class="heading-arrow"></div>',
          iconSize: [20, 20]
        })
      }).addTo(gpsLayer);
    } else {
      headingMarker.setLatLng(latlng);
    }

    // Breadcrumb trail
    if (breadcrumbEnabled) {
      breadcrumbLayer.addLatLng(latlng);
    }
  }

  function onLocationError(e) {
    alert("GPS error: " + e.message);
  }

  window.addEventListener("deviceorientation", function(event) {
    if (headingMarker && event.alpha !== null) {
      const heading = event.alpha;
      const arrow = headingMarker.getElement().querySelector(".heading-arrow");
      if (arrow) {
        arrow.style.transform = `rotate(${heading}deg)`;
      }
    }
  });

  // ==========================================================
  // LAYER CONTROL (NAIP REMOVED)
  // ==========================================================

  const baseMaps = {
    "2025 Waushara County WROC — Leaf-Off": waushara2025,
    "Wisconsin DNR — Latest Leaf-Off": wisconsinLeafOff,
    "Wisconsin DNR — Leaf-On": wisconsinLeafOn,
    "ESRI World Imagery": esriImagery
  };

  const overlays = {
    "Show My Location": gpsLayer,
    "Breadcrumb Trail": breadcrumbLayer,
    "Trails": trailsLayer,
    "Contours & Water": contoursWaterLayer,
    "1100' Contours": contours1100Layer,
    "3' Contours": contours3Layer,
    "Stands": standsLayer,
    "Parcels": parcelsLayer
  };

  const layerControl = L.control.layers(baseMaps, overlays, { collapsed: true }).addTo(map);

  // GPS toggle
  map.on('overlayadd', function(e) {
    if (e.name === "Show My Location") {
      startGPS();
    }
    if (e.name === "Breadcrumb Trail") {
      breadcrumbEnabled = true;
    }
  });

  map.on('overlayremove', function(e) {
    if (e.name === "Show My Location") {
      stopGPS();
    }
    if (e.name === "Breadcrumb Trail") {
      breadcrumbEnabled = false;
      breadcrumbLayer.setLatLngs([]); // clear trail
    }
  });

</script>

</body>
</html>
